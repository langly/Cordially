{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="signin">
  <h1>Sign in</h1>
  <p class="muted">Hosts only. Guests RSVP through their invitation link and never need an account.</p>

  <form method="post" class="card signin-form">
    <label>Email
      <input name="email" type="email" value="{{ email }}" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <label class="checkbox">
      <input type="checkbox" name="remember" value="1"> Stay signed in
    </label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
