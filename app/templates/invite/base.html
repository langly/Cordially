<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Anyone with the link can view this, so keep it out of search results. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}You're invited{% endblock %}</title>
  {% if fonts_url %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="{{ fonts_url }}" rel="stylesheet">
  {% endif %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/invite.css') }}">
</head>
<body data-theme="{{ theme_name|default('classic') }}" data-layout="{{ layout_name|default('classic') }}">
  <div class="stage">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
